# THE DAILY SPINE — Roadmap Phase 0.
#
# Ingest -> validate -> rebuild snapshots -> append the signal ledger ->
# commit -> push. The push triggers Vercel, so a green run IS a deployed
# site with today's close in it.
#
# Design decisions, stated so nobody has to reverse-engineer them:
#
#  - `--only-us`: this job's scope is exactly what the snapshots read. The FX
#    pairs carry long-standing validation findings that are a research
#    problem; letting them fail the DAILY job would make it permanently red,
#    and a pipeline that is always red alerts nobody. Within the US set,
#    refusals still fail the job loudly — that is the validator doing its job
#    and the right response is a human looking at it, not a retry.
#
#  - No secrets. The equity ingest and both snapshot builders are entirely
#    public-endpoint. The crypto research fetch (Coinalyze/FRED keys) is a
#    separate, deliberately manual concern — the crypto surfaces are LIVE at
#    request time and do not depend on this job.
#
#  - Commits use the data's as-of date and [skip ci] is deliberately absent:
#    the Vercel rebuild is the point.
#
#  - 22:15 UTC weekdays: after the US close in both DST regimes, before the
#    provider's daily bar could plausibly still be settling.
name: daily-intelligence

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull before push below; a same-day human commit must not be clobbered.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ingest US daily bars (validate-or-refuse)
        run: npx tsx scripts/ingest/yahoo.ts --only-us

      - name: Rebuild intelligence snapshot
        run: npx tsx scripts/ingest/buildIntelligence.ts

      # Degrade-don't-fail by design: on any error (Nasdaq is known to reject
      # some datacenter IPs) the script exits 0 and keeps the committed
      # calendar, whose entries expire naturally by date. See earningsVeto.ts.
      - name: Refresh earnings calendar
        run: npx tsx scripts/ingest/fetchEarningsCalendar.ts

      - name: Rebuild markets snapshot
        run: npx tsx scripts/ingest/buildMarketsSnapshot.ts

      # The reference panel behind the one validated equity signal. It reads
      # the raw bar files rather than a snapshot, so it belongs to the ingest
      # rather than to the snapshot builders — and it MUST run here, because
      # nothing else can: those files are 146MB and gitignored, which is the
      # whole reason the ~10KB artifact is committed instead.
      #
      # It is here at all because equityMomentum.ts degrades on a timer with
      # no error: past 10 days it withholds the forecast, past 45 the section
      # disappears. Manually refreshed, the signal quietly stopped making its
      # claim a week and a half after anyone last remembered.
      - name: Rebuild equity cross-section panel
        run: npx tsx scripts/research/buildCrossSection.ts

      - name: Append signal history ledger
        run: npx tsx scripts/ingest/appendHistory.ts

      - name: Register and score forward predictions (reach + verdict)
        run: npx tsx scripts/ingest/forwardScoring.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/marketIntelligence.json src/data/equityMarkets.json src/data/signalLedger.json src/data/earningsCalendar.json src/data/forwardReachRecord.json src/data/forwardVerdictRecord.json src/data/equityCrossSection.json
          if git diff --cached --quiet; then
            echo "No data changes (holiday or re-run on identical bars) — nothing to deploy."
            exit 0
          fi
          git commit -m "data: daily intelligence refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
