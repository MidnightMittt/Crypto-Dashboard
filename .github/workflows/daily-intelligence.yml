# THE DAILY SPINE — Roadmap Phase 0.
#
# Ingest -> validate -> rebuild snapshots -> append the signal ledger ->
# commit -> push. The push triggers Vercel, so a green run IS a deployed
# site with today's close in it.
#
# Design decisions, stated so nobody has to reverse-engineer them:
#
#  - `--only-us`: this job's scope is exactly what the snapshots read. The FX
#    pairs carry long-standing validation findings that are a research
#    problem; letting them fail the DAILY job would make it permanently red,
#    and a pipeline that is always red alerts nobody. Within the US set,
#    refusals still fail the job loudly — that is the validator doing its job
#    and the right response is a human looking at it, not a retry.
#
#  - No secrets. The equity ingest and both snapshot builders are entirely
#    public-endpoint. The crypto research fetch (Coinalyze/FRED keys) is a
#    separate, deliberately manual concern — the crypto surfaces are LIVE at
#    request time and do not depend on this job.
#
#  - Commits use the data's as-of date and [skip ci] is deliberately absent:
#    the Vercel rebuild is the point.
#
#  - 22:15 UTC weekdays: after the US close in both DST regimes, before the
#    provider's daily bar could plausibly still be settling.
name: daily-intelligence

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull before push below; a same-day human commit must not be clobbered.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ingest US daily bars (validate-or-refuse)
        run: npx tsx scripts/ingest/yahoo.ts --only-us

      - name: Rebuild intelligence snapshot
        run: npx tsx scripts/ingest/buildIntelligence.ts

      # Degrade-don't-fail by design: on any error (Nasdaq is known to reject
      # some datacenter IPs) the script exits 0 and keeps the committed
      # calendar, whose entries expire naturally by date. See earningsVeto.ts.
      - name: Refresh earnings calendar
        run: npx tsx scripts/ingest/fetchEarningsCalendar.ts

      - name: Rebuild markets snapshot
        run: npx tsx scripts/ingest/buildMarketsSnapshot.ts

      # The reference panel behind the one validated equity signal. It reads
      # the raw bar files rather than a snapshot, so it belongs to the ingest
      # rather than to the snapshot builders — and it MUST run here, because
      # nothing else can: those files are 146MB and gitignored, which is the
      # whole reason the ~10KB artifact is committed instead.
      #
      # It is here at all because equityMomentum.ts degrades on a timer with
      # no error: past 10 days it withholds the forecast, past 45 the section
      # disappears. Manually refreshed, the signal quietly stopped making its
      # claim a week and a half after anyone last remembered.
      # Keyless FRED. Both legs of the volatility term structure are checked
      # for staleness and the step FAILS rather than writing a ratio whose
      # numerator and denominator describe different weeks — the exact defect
      # that ruled out Yahoo's ^VIX3M, which was four weeks behind its ^VIX.
      - name: Refresh FRED macro series
        run: npx tsx scripts/ingest/fetchMacroSeries.ts

      - name: Rebuild equity cross-section panel
        run: npx tsx scripts/research/buildCrossSection.ts

      - name: Append signal history ledger
        run: npx tsx scripts/ingest/appendHistory.ts

      - name: Register and score forward predictions (reach + verdict)
        run: npx tsx scripts/ingest/forwardScoring.ts

      # WHY THIS DOES NOT REBASE, and it is not a style preference.
      #
      # The old sequence committed first and then `git pull --rebase origin
      # main`. That replays a commit full of regenerated JSON onto whatever
      # landed during the run — and regenerated JSON conflicts with
      # regenerated JSON every time, because both sides rewrote the same
      # lines from scratch. There is no merge driver that can resolve it and
      # no reason to try: our copy is derived from today's bars and is
      # strictly newer.
      #
      # It killed the job in practice, not in theory. Both scheduled runs on
      # 2026-08-14 failed at exactly this step while eleven unrelated commits
      # landed on main during their windows, two of them touching
      # forwardReachRecord.json. More than one agent works in this repository,
      # so a rebase here fails on most days — which is why the signal ledger
      # held three entries instead of one per session, and why the "since
      # when" work that depends on ~20 of them has been stuck.
      #
      # So: move onto the real tip FIRST, then stage. `--mixed` repoints the
      # branch without touching the working tree, so today's freshly
      # generated files survive and are staged as a diff against the current
      # tip. No merge happens, so nothing can conflict. Only the eight
      # declared paths are staged, per the repository's explicit-staging rule.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATA_PATHS="src/data/marketIntelligence.json src/data/equityMarkets.json src/data/signalLedger.json src/data/earningsCalendar.json src/data/forwardReachRecord.json src/data/forwardVerdictRecord.json src/data/equityCrossSection.json src/data/macroSeries.json"

          stage_onto_tip() {
            # Explicit refspec: `git fetch origin main` only updates the
            # remote-tracking ref opportunistically, and everything below
            # depends on origin/main actually being the tip.
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --mixed origin/main
            git add $DATA_PATHS
          }

          stage_onto_tip
          if git diff --cached --quiet; then
            echo "No data changes (holiday or re-run on identical bars) — nothing to deploy."
            exit 0
          fi
          git commit -m "data: daily intelligence refresh $(date -u +%F)"

          # A push can still lose a race with a commit made in the last few
          # seconds. Rebuild the commit on the newer tip and try again rather
          # than failing a run whose data is already correct.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — restaging onto the new tip"
            stage_onto_tip
            if git diff --cached --quiet; then
              echo "the newer tip already carries identical data — nothing left to push."
              exit 0
            fi
            git commit -m "data: daily intelligence refresh $(date -u +%F)"
          done

          echo "::error::push failed three times against a moving main"
          exit 1
