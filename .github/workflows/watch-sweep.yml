# THE LEVEL WATCHDOG'S CLOCK.
#
# Vercel Cron would be the natural home for this and is not available: crons
# more frequent than daily are a paid-plan feature, and on Hobby the platform
# does not fail the deployment — it declines to CREATE one. Commit 2cad036
# carried `*/5 13-21 * * 1-5` and produced no deployment at all, so the
# watchdog routes 404'd in production while the commit sat on main looking
# shipped. See 9b1bd76.
#
# ── The drift problem, and why this does not fight it ─────────────────
#
# GitHub's scheduler is late, and in this repository it is late by a lot:
# 41, 80, 112 and 123 minutes past the requested slot, measured. A naive
# `*/5` cron here would not give five-minute sweeps; it would give whatever
# the queue felt like, which is exactly the false promise a stop must not be
# built on.
#
# So the cron is used only to START a job, never to pace one. Once a runner
# is alive, `sleep` is accurate to the second. Each run therefore waits on
# the Eastern wall clock and then sweeps every SWEEP_SECONDS itself, turning
# an unreliable scheduler into a reliable cadence.
#
# ── Why several overlapping starts, deliberately ──────────────────────
#
# A single daily start would put the whole session behind one drifting
# trigger. Instead there are several, each covering a couple of hours, and
# they are ALLOWED to overlap — no cancel-in-progress, no concurrency group.
#
# Overlap is free because sweeps are idempotent: a level fires exactly once
# (see src/lib/watch/levels.ts), so two runners sweeping the same minute
# cannot double-alert. That property is what lets redundancy substitute for
# precision. If one start is ninety minutes late, another is already running.
#
# ── What this covers, and what it does NOT ───────────────────────────
#
# The envelope is 04:00-20:00 ET on weekdays — the full window the quote
# source actually prints (includePrePost reaches pre-market and after-hours;
# measured, not assumed). It used to stop at 16:05 ET, which left levels on
# all_day_hours positions unwatched for ~4 live hours every evening — the
# IBIT tape printed three new highs 16:00-20:00 ET on 2026-08-21 while
# nothing swept. That hole was a choice this file made, not a limit of the
# data, so the file closed it.
#
# What remains uncovered is a limit of the data: 20:00-04:00 ET and
# weekends have NO prints on this quote source (the overnight venue's tape
# does not reach it), so a sweep there would only find stale quotes and the
# staleness guard would rightly refuse every level. Covering it needs a
# different source, not more cron.
#
# THE COVERAGE IS DECLARED TWICE: here, and as SWEEP_COVERAGE in
# src/lib/watch/levels.ts, which every armed level carries to its caller.
# Change them together or the API starts stating a window this file does
# not sweep.
name: watch-sweep

on:
  schedule:
    # Staggered starts across the whole 04:00-20:00 ET envelope, in UTC.
    # 90-minute spacing with 170-minute runtimes doubles coverage everywhere,
    # so one start lost to scheduler drift leaves another already running.
    # Being early costs nothing: the job waits for OPEN_ET on the Eastern
    # clock. (In winter these UTC slots land an hour earlier in ET, which
    # only lengthens the wait.)
    - cron: "5 8 * * 1-5"
    - cron: "35 9 * * 1-5"
    - cron: "5 11 * * 1-5"
    - cron: "35 12 * * 1-5"
    - cron: "5 14 * * 1-5"
    - cron: "35 15 * * 1-5"
    - cron: "5 17 * * 1-5"
    - cron: "35 18 * * 1-5"
    - cron: "5 20 * * 1-5"
    - cron: "35 21 * * 1-5"
    - cron: "5 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Comfortably longer than one run's coverage, far short of the 6h ceiling.
    timeout-minutes: 170
    steps:
      - name: Sweep armed levels until the close
        env:
          BASE: https://crypto-dashboard-65d9.vercel.app
          # Optional. Set it as a repository secret AND in Vercel to close the
          # endpoint to the public; unset, the route accepts the call and says
          # so in its own source rather than pretending to be protected.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Five minutes: the cadence the alerting was specified around, and
          # the same window the endpoint refuses to fire on a quote older than.
          SWEEP_SECONDS: "300"
          # The quote source's own window: prints exist ~04:00-20:00 ET and
          # nowhere outside it, so the envelope matches the data rather than
          # the exchange bell. Past END_ET every quote goes stale and the
          # guard would skip everything; before OPEN_ET the loop waits.
          END_ET: "2000"
          OPEN_ET: "0400"
        run: |
          set -uo pipefail

          auth=()
          if [ -n "${CRON_SECRET}" ]; then
            auth=(-H "authorization: Bearer ${CRON_SECRET}")
          else
            echo "::warning::CRON_SECRET is not set — /api/watch/sweep is publicly callable."
          fi

          # Minutes-since-midnight in US market time. Base-10 forced: 0930
          # would otherwise be read as octal and fail.
          et_now() { TZ=America/New_York date +%H%M; }
          as_int() { echo $((10#$1)); }

          end=$(as_int "$END_ET")
          open=$(as_int "$OPEN_ET")
          fired_total=0
          sweeps=0

          # A start that lands after the close is drift doing its worst, not a
          # broken watchdog. The two must not fail the same way: distinguishing
          # them is the difference between an alarm worth reading and one that
          # cries wolf every evening until it is ignored.
          started_after_close=0
          if [ "$(as_int "$(et_now)")" -ge "$end" ]; then
            started_after_close=1
          fi

          while true; do
            now=$(as_int "$(et_now)")

            if [ "$now" -ge "$end" ]; then
              echo "Past $END_ET ET — session covered. $sweeps sweeps, $fired_total level(s) fired."
              break
            fi

            if [ "$now" -lt "$open" ]; then
              echo "$(et_now) ET — before the open, waiting."
              sleep "$SWEEP_SECONDS"
              continue
            fi

            # A failed request must cost one sweep, never the run: a transient
            # 5xx or a cold start is not a reason to stop watching stops.
            # 401 is the one exception — see below.
            code=$(curl -sS --max-time 60 -o /tmp/sweep.json -w '%{http_code}' \
              "${auth[@]}" "${BASE}/api/watch/sweep" || echo 000)
            body=$(cat /tmp/sweep.json 2>/dev/null || echo '{"error":"request failed"}')
            sweeps=$((sweeps + 1))

            # A 401 MEANS THE WATCHDOG IS DISARMED, and it must not read as a
            # blip. It happens when this runner's CRON_SECRET does not match
            # the deployment's — a stray newline in a pasted value is enough.
            # Every sweep would then be rejected, every stop would go
            # unwatched, and the run would keep looping while emitting
            # warnings nobody reads. That is the exact shape of failure this
            # repository has hit repeatedly: a component reporting something
            # true while the thing it protects is dead. So this stops the run.
            if [ "$code" = "401" ]; then
              echo "::error::Sweep rejected with 401 — this runner's CRON_SECRET does not match the deployment's. THE WATCHDOG IS NOT RUNNING. Check the secret in both GitHub and Vercel; Vercel needs a REDEPLOY to pick up a changed value."
              exit 1
            fi

            # *** MUST STAY ON ONE LINE. This broke the workflow for 18 consecutive runs. ***
            # A YAML block scalar ends the moment a line's indentation drops below the
            # block's. The previous version continued this python at COLUMN 0, so YAML
            # closed `run:` and then tried to parse `try:` as a top-level mapping key.
            # The document was invalid, GitHub refused to create any job, and every run
            # completed as `failure` with ZERO jobs — including the very first one.
            # `workflow_dispatch` also 422'd, because triggers cannot register on a file
            # that does not validate. The scheduled sweep never executed once.
            # The try/except was redundant anyway: `|| echo -1` already covers a
            # non-zero exit, which is what a json parse failure produces.
            n=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("fired"); print(len(f) if isinstance(f,list) else -1)' 2>/dev/null || echo -1)

            if [ "$n" = "-1" ]; then
              echo "::warning::sweep at $(et_now) ET returned an unreadable response: $(printf '%s' "$body" | head -c 200)"
            elif [ "$n" -gt 0 ]; then
              fired_total=$((fired_total + n))
              # Loud, because this is the entire point of the workflow.
              echo "::notice::$(et_now) ET — $n level(s) FIRED"
              printf '%s\n' "$body" | head -c 2000
            else
              echo "$(et_now) ET — swept, nothing fired."
            fi

            sleep "$SWEEP_SECONDS"
          done

          if [ "$sweeps" -eq 0 ]; then
            if [ "$started_after_close" -eq 1 ]; then
              # Worth surfacing — repeated warnings here mean the schedule
              # needs moving earlier — but not a failure. Nothing is broken.
              echo "::warning::Started at $(et_now) ET, after the $END_ET close: this trigger was lost to scheduler drift and swept nothing."
            else
              # Inside market hours and never swept once: a broken watchdog
              # wearing a green check, which is the shape of failure this
              # whole workflow exists to avoid.
              echo "::error::Ran during market hours without completing a single sweep — the watchdog did not run."
              exit 1
            fi
          fi

          # THE SWEEP'S OWN 200 IS NOT PROOF IT WATCHED ANYTHING.
          #
          # A sweep answers 200 when it runs and judges nothing, because every
          # quote was too stale to trust. That is the failure mode that looks
          # most like success: zero alerts, green check, nothing watched.
          #
          # So the run is graded on what the deployment says about itself
          # afterwards, not on the status code we just received. The health
          # endpoint needs no secret, so this check works even when the
          # mismatch it is looking for is the secret itself.
          if [ "$sweeps" -gt 0 ]; then
            health=$(curl -sS --max-time 30 "${BASE}/api/watch/health" \
              | sed -n 's/.*"health":"\([a-z_]*\)".*/\1/p')
            echo "post-sweep health: ${health:-unreadable}"
            case "$health" in
              watching) : ;;
              blind)
                echo "::error::Swept $sweeps time(s) and judged NOTHING — every quote was too stale. The watchdog is running and blind, which reports the same silence as a quiet market. Check the quote feed, not the scheduler."
                exit 1 ;;
              never_ran)
                echo "::error::Swept $sweeps time(s) but the deployment has no record of any sweep. This runner and the deployment being swept are not the same environment, or the heartbeat store is unreachable."
                exit 1 ;;
              "")
                # Never fail the watchdog because its monitor was unreachable.
                echo "::warning::Could not read /api/watch/health — liveness unverified for this run." ;;
              *)
                echo "::warning::Unexpected health state '$health' after sweeping." ;;
            esac
          fi
