# EXECUTION-WINDOW SPREAD CAPTURE
#
# Records bid/ask for the scanner universe at specific US/Eastern minutes.
# This is the one dataset here that cannot be reconstructed later at any
# price: OHLCV bars carry no quote data, and the Corwin-Schultz high-low
# estimator returns 114-177bp on these names where the observed book is one
# tick. Every session not captured is gone.
#
# ── Why the crons fire EARLY and the job waits ────────────────────────
#
# GitHub's scheduled workflows are best-effort. This repository's own daily
# job, cron `15 22 * * 1-5`, actually fired at 04:30 and 22:58 on 2026-08-14 —
# drift measured in hours. A cron aimed directly at 15:50 ET would routinely
# capture a closed book and stamp it as the entry window, which is worse than
# capturing nothing because nothing downstream could detect it.
#
# So each cron fires well ahead and recordSpreads.ts waits on the wall clock
# itself, then SKIPS any target that has already passed rather than
# back-stamping it. Drift only has to be smaller than the head start.
#
# ── One cron per window, and why the pair had to go ───────────────────
#
# This used to run two crons an hour apart to bracket both halves of the DST
# year, with a 45-minute head start rejecting whichever one belonged to the
# other half. That worked, but it CAPPED the drift tolerance at 45 minutes:
# any longer head start and both crons would have captured.
#
# On 2026-08-17 GitHub delivered the entry cron 41 minutes late and the exit
# cron 113 minutes late. Both jobs arrived after their last target, both
# correctly refused to back-stamp, and all four runs of the day reported
# success while writing nothing. A full session was lost silently.
#
# So there is now ONE cron per window, placed at the UTC time that is early in
# BOTH halves of the year: 90 minutes ahead under EDT, 150 under EST. The job
# waits longer in winter. No DST rule is encoded anywhere — the wait is
# computed from the Eastern wall clock on every run.
#
# ── A lost window now FAILS ───────────────────────────────────────────
#
# Because there is no second cron whose job is to no-op, "captured nothing"
# is no longer ambiguous, and the script exits non-zero on it. Market holidays
# are excluded first via Tradier's calendar, so this alarm fires only when
# something is genuinely wrong. A red run is the point: the previous design
# could lose every session indefinitely without a single failed check.
name: record-spreads

on:
  schedule:
    # Exit window, targets 09:35-09:50 ET.
    # 10:35 UTC is 06:35 EDT (180 min early) / 05:35 EST (240 min early).
    - cron: "35 10 * * 1-5"
    # Entry window, targets 15:50-15:58 ET.
    # 16:50 UTC is 12:50 EDT (180 min early) / 11:50 EST (240 min early).
    - cron: "50 16 * * 1-5"
  workflow_dispatch:
    inputs:
      window:
        description: "Which window to capture"
        required: true
        default: entry
        type: choice
        options: [entry, exit]
      smoke:
        description: "Read quotes now and write nothing — verifies the credentials without waiting for a market minute"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Never cancel a run in flight: it may be seconds from its capture minute.
concurrency:
  group: record-spreads-${{ github.event.schedule || github.event.inputs.window }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # The job spends nearly all of its life asleep. Must clear the WINTER head
    # start (240 min) plus the wait across the window itself, or the runner
    # would be killed mid-doze every day from November to March.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The morning cron takes the exit window, the afternoon one the entry
      # window. A manual dispatch says which it wants.
      - name: Capture quotes
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          TRADIER_ENV: ${{ secrets.TRADIER_ENV }}
        run: |
          set -euo pipefail
          SCHED="${{ github.event.schedule }}"
          WINDOW="${{ github.event.inputs.window }}"
          if [ -z "$WINDOW" ]; then
            case "$SCHED" in
              "35 10 * * 1-5") WINDOW=exit ;;
              *) WINDOW=entry ;;
            esac
          fi
          # A smoke dispatch reads quotes and persists nothing, so the
          # credentials can be proven the day they are set rather than on the
          # next trading morning. It also bypasses the head-start guard, which
          # would otherwise exit before ever touching the API.
          if [ "${{ github.event.inputs.smoke }}" = "true" ]; then
            echo "SMOKE TEST — reading quotes, writing nothing"
            npx tsx scripts/ingest/recordSpreads.ts --window "$WINDOW" --now
            exit 0
          fi
          echo "capturing window: $WINDOW"
          npx tsx scripts/ingest/recordSpreads.ts --window "$WINDOW"

      # Same no-rebase discipline as the daily job: regenerated JSON conflicts
      # with regenerated JSON, so land on the tip first and never replay.
      # Skipped entirely on a smoke dispatch, which writes nothing by design.
      - name: Commit and push
        if: github.event.inputs.smoke != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git add <missing path>` exits 128 and, under `set -e`, fails the
          # step. That is not hypothetical: it failed the first dispatch.
          #
          # This is now only reachable on a market holiday, where the capture
          # step exits 0 without writing. Every other empty outcome fails in
          # the step above and never gets here.
          if [ ! -f src/data/spreadHistory.json ]; then
            echo "No spread history written this run (market holiday) — nothing to commit."
            exit 0
          fi

          stage_onto_tip() {
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --mixed origin/main
            git add src/data/spreadHistory.json
          }

          stage_onto_tip
          if git diff --cached --quiet; then
            echo "No captures this run (window missed, holiday, or provider down)."
            exit 0
          fi
          git commit -m "data: execution-window spreads $(date -u +%FT%TZ)"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — restaging onto the new tip"
            stage_onto_tip
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: execution-window spreads $(date -u +%FT%TZ)"
          done
          echo "::error::push failed three times against a moving main"
          exit 1
