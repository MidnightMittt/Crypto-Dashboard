# EXECUTION-WINDOW SPREAD CAPTURE
#
# Records bid/ask for the scanner universe at specific US/Eastern minutes.
# This is the one dataset here that cannot be reconstructed later at any
# price: OHLCV bars carry no quote data, and the Corwin-Schultz high-low
# estimator returns 114-177bp on these names where the observed book is one
# tick. Every session not captured is gone.
#
# ── Why the crons fire EARLY and the job waits ────────────────────────
#
# GitHub's scheduled workflows are best-effort. This repository's own daily
# job, cron `15 22 * * 1-5`, actually fired at 04:30 and 22:58 on 2026-08-14 —
# drift measured in hours. A cron aimed directly at 15:50 ET would routinely
# capture a closed book and stamp it as the entry window, which is worse than
# capturing nothing because nothing downstream could detect it.
#
# So each cron fires well ahead and recordSpreads.ts waits on the wall clock
# itself, then SKIPS any target that has already passed rather than
# back-stamping it. Drift only has to be smaller than the head start.
#
# ── THREE crons per window, and why chasing the drift failed ──────────
#
# One cron per window only works while `head start > worst delivery delay`,
# and that inequality kept breaking because the right-hand side moves.
#
# Measured here: the exit slot ran +73 to +123 min through 2026-08-26, then
# jumped to +235..+251 min on 08-28 and stayed there. Its 180-minute head
# start — itself sized against an earlier 123-minute worst case — was beaten
# by roughly an hour EVERY WEEKDAY for fifteen sessions. Each one is a
# permanently lost morning book. The entry slot survived the same period only
# because its delay sat at +148..+167, clearing its allowance by as little as
# 13 minutes.
#
# The previous note here concluded that a pair of crons was unsafe because
# both might capture. That was wrong, and the store already said so:
# `appendObservations` is keyed on symbol|session|window|targetMinute and
# REPLACES, so a duplicate capture of one minute has always been a no-op. The
# 45-minute head start was defending an invariant that was never at risk, and
# the single-cron design it forced is what made drift fatal.
#
# So: four crons per window, 100 minutes apart. The script dozes at most 280
# minutes (MAX_HEAD_START_MS), so each cron covers a 280-minute band of
# delivery delay, and the bands overlap:
#
#   head start (EDT)   covers delay      head start (EST)   covers delay
#   400 min            120-400           460 min            180-460
#   300 min             20-300           360 min             80-360
#   200 min              0-200           260 min              0-260
#   100 min              0-100           160 min              0-160
#   ----------------------------------------------------------------
#   union                0-400           union                0-460
#
# COVERAGE IS NOT THE SAME AS REDUNDANCY, and two drafts of this got it wrong
# in two different ways. Three crons 120 minutes apart covered 0-380 with no
# gap — but the seam fell at 140-180 minutes of delay, precisely where the
# entry slot has been running (+148..+167). The one window that still worked
# would have shipped on a single point of failure.
#
# The second draft fixed that and still left winter single-covered at low
# drift, because every head start is 60 minutes LONGER under EST and the two
# earliest crons fell outside a 200-minute ceiling. Hence 280. The schedule
# test checks redundancy per season across every delay ever measured here,
# which is how both mistakes were found rather than shipped.
#
# Nothing encodes which half of the DST year it is; the wait is computed from
# the Eastern wall clock every run, which is why the EST column is simply the
# EDT column plus 60. Losing one cron costs margin, not the session.
#
# ── A lost window still FAILS, but the question changed ───────────────
#
# "Captured nothing" is no longer evidence of a problem — on a healthy day two
# of the three runs capture nothing, because a sibling got there first. So the
# script now asks whether ANY run has recorded this session-window, and only
# throws when none has. That is the question the alarm was always trying to
# ask. Market holidays are excluded first via Tradier's calendar.
name: record-spreads

on:
  schedule:
    # Exit window, targets 09:35-09:50 ET (13:35 UTC EDT / 14:35 UTC EST).
    - cron: "55 6 * * 1-5" # 400 min ahead under EDT
    - cron: "35 8 * * 1-5" # 300 min
    - cron: "15 10 * * 1-5" # 200 min
    - cron: "55 11 * * 1-5" # 100 min
    # Entry window, targets 15:50-15:58 ET (19:50 UTC EDT / 20:50 UTC EST).
    - cron: "10 13 * * 1-5" # 400 min ahead under EDT
    - cron: "50 14 * * 1-5" # 300 min
    - cron: "30 16 * * 1-5" # 200 min
    - cron: "10 18 * * 1-5" # 100 min
  workflow_dispatch:
    inputs:
      window:
        description: "Which window to capture"
        required: true
        default: entry
        type: choice
        options: [entry, exit]
      smoke:
        description: "Read quotes now and write nothing — verifies the credentials without waiting for a market minute"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Never cancel a run in flight: it may be seconds from its capture minute.
#
# Grouped per SCHEDULE, not per window, which matters now that three crons
# share a window. Grouping by window would serialise the siblings, and a
# late-arriving one queued behind a dozing one is a cron that cannot cover its
# band — the redundancy would be nominal.
concurrency:
  group: record-spreads-${{ github.event.schedule || github.event.inputs.window }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # The job spends nearly all of its life asleep, but never longer than
    # MAX_HEAD_START_MS (280 min) plus the 15-minute span of the window
    # itself. Anything earlier than the ceiling exits without capturing, so
    # this bound holds in both halves of the year — and it stays clear of
    # GitHub's 360-minute ceiling on a hosted job, which is the constraint
    # that made "just fire the one cron earlier" a dead end.
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The four morning crons take the exit window, the four afternoon ones
      # the entry window. A manual dispatch says which it wants.
      - name: Capture quotes
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          TRADIER_ENV: ${{ secrets.TRADIER_ENV }}
        run: |
          set -euo pipefail
          SCHED="${{ github.event.schedule }}"
          WINDOW="${{ github.event.inputs.window }}"
          if [ -z "$WINDOW" ]; then
            # Matched EXPLICITLY, never by a default arm. A wildcard fallback
            # is what would silently relabel a mistyped cron as the entry
            # window and file morning quotes under an afternoon minute — a
            # corruption no downstream check could see, because the rows would
            # look perfectly well-formed.
            case "$SCHED" in
              "55 6 * * 1-5"|"35 8 * * 1-5"|"15 10 * * 1-5"|"55 11 * * 1-5") WINDOW=exit ;;
              "10 13 * * 1-5"|"50 14 * * 1-5"|"30 16 * * 1-5"|"10 18 * * 1-5") WINDOW=entry ;;
              *)
                echo "::error::unrecognised schedule '$SCHED' — add it to this map before it can capture"
                exit 1
                ;;
            esac
          fi
          # A smoke dispatch reads quotes and persists nothing, so the
          # credentials can be proven the day they are set rather than on the
          # next trading morning. It also bypasses the head-start guard, which
          # would otherwise exit before ever touching the API.
          if [ "${{ github.event.inputs.smoke }}" = "true" ]; then
            echo "SMOKE TEST — reading quotes, writing nothing"
            npx tsx scripts/ingest/recordSpreads.ts --window "$WINDOW" --now
            exit 0
          fi
          echo "capturing window: $WINDOW"
          npx tsx scripts/ingest/recordSpreads.ts --window "$WINDOW"

      # Same no-rebase discipline as the daily job: regenerated JSON conflicts
      # with regenerated JSON, so land on the tip first and never replay.
      # Skipped entirely on a smoke dispatch, which writes nothing by design.
      - name: Commit and push
        if: github.event.inputs.smoke != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git add <missing path>` exits 128 and, under `set -e`, fails the
          # step. That is not hypothetical: it failed the first dispatch.
          #
          # Reachable on a market holiday, and — since the window went to three
          # crons — on any run whose siblings captured first. Both exit 0 from
          # the step above without writing. A genuinely lost session still
          # fails there and never reaches here.
          if [ ! -f src/data/spreadHistory.json ]; then
            echo "No spread history written this run (market holiday) — nothing to commit."
            exit 0
          fi

          stage_onto_tip() {
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --mixed origin/main
            git add src/data/spreadHistory.json
          }

          stage_onto_tip
          if git diff --cached --quiet; then
            echo "Nothing new to commit — a sibling cron captured this window, or it is a holiday."
            exit 0
          fi
          git commit -m "data: execution-window spreads $(date -u +%FT%TZ)"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — restaging onto the new tip"
            stage_onto_tip
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: execution-window spreads $(date -u +%FT%TZ)"
          done
          echo "::error::push failed three times against a moving main"
          exit 1
