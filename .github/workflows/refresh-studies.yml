# ── THE STUDIES, ON A CLOCK ───────────────────────────────────────────
#
# The nightly job refreshes what the market did. It has never refreshed the
# studies — the replays and grids the site quotes as EVIDENCE. Those were
# regenerated by hand, and "by hand" resolved to "not at all": on 2026-09-12
# every artefact this job owns was between 24 and 28 days old, while the
# surfaces serving them updated every night.
#
# That is worse than an obviously dead page. overnightPremium.json is the
# evidence behind the only method carrying LIVE status in the register, and
# /api/pretrade serves it as current. signalValidation.json is where the
# home page and /validation get their observation counts. A stale number is
# most dangerous surrounded by fresh ones, because the fresh ones vouch for
# it.
#
# ── Why this is not a step in daily-intelligence.yml ──────────────────
#
# Two reasons, and the second is the real one.
#
# These are replays and parameter grids over 146MB of bars, not projections
# of an already-computed snapshot — minutes each, not seconds. Bolting them
# onto a 30-minute nightly job would make the ingest everything depends on
# hostage to a slow study.
#
# And they do not need to run nightly. A weekly study answering "what did
# five years of bars say" moves by one session out of ~1250 when it runs a
# day late. The CBOE capture in the nightly job is the opposite — a session
# not recorded there is gone for good — which is exactly why the two belong
# on different clocks and different failure policies.
#
# ── Saturday 06:30 UTC ────────────────────────────────────────────────
#
# After Friday's close and after Friday's nightly job, with hours of margin
# on both. GitHub's scheduler drifts by hours here — measured, not feared:
# the `15 22` nightly cron has delivered at 04:30 and at 22:58 — and this job
# is the one place in the repository where that costs nothing at all. It also
# sits clear of the seven crypto-book crons (07 past 01/04/08/12/16/19/22).
#
# ── Soft per step, hard at the gate ───────────────────────────────────
#
# Each study warns rather than fails, so one broken grid cannot cost the
# other three their weekly run. The price of that is that the exit code stops
# meaning anything: every step could warn, the commit step would find no diff
# and exit 0 with a cheerful message, and the run would be green with five
# month-old files still on the site.
#
# So the run is judged at the end, on the only thing it claims: every
# declared artefact carries a `generatedAt` from inside this run. Not "the
# bytes changed" — a study re-run on unchanged bars legitimately writes
# identical output, and a check whose failures are spurious gets weakened
# until it passes. The stamp is the claim, so the stamp is what is gated.
#
# The manifest of what that means lives in src/lib/history/studyArtifacts.ts,
# once, and studyRefresh.test.ts asserts this file agrees with it in both
# directions — every generator invoked, every output staged, nothing staged
# that nothing here writes.
#
# ── What this job does NOT fix ────────────────────────────────────────
#
# backtestMetricStats, backtestResearch, backtestStats,
# historicalFingerprints and executionStats are equally stale (2026-08-15)
# and are NOT here. They come from `npm run backtest`, which reads
# scripts/backtest/data/ — a gitignored corpus that fetchHistory.mjs will not
# build without COINALYZE_API_KEY. That is one blocked dependency, not five
# separate ones, and adding the steps would produce a red job every week
# reporting a missing secret as a broken study. BLOCKED_ON_BACKTEST_CORPUS in
# the manifest records it so it stays a decision rather than becoming an
# oversight again.

name: refresh-studies

on:
  schedule:
    - cron: "30 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-studies
  cancel-in-progress: false

jobs:
  studies:
    runs-on: ubuntu-latest
    # The equity replay walks the whole panel bar by bar and writes a 5MB
    # analog library. Generous, because the failure mode of a tight timeout
    # here is a killed study reported as a warning.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull before push below; a commit landing mid-run must not be clobbered.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Stamped BEFORE anything runs. Every artefact must carry a
      # `generatedAt` at or after this instant, so no pre-existing file can
      # satisfy the gate no matter what else happens to it during the run.
      - name: Mark the start of the run
        run: echo "REFRESH_STARTED_MS=$(date -u +%s)000" >> "$GITHUB_ENV"

      # HARD failure, unlike everything below it. The bar files are gitignored
      # and 146MB, so they exist only on this runner: without them every study
      # below either crashes or — worse — quietly measures whatever partial
      # universe did download. The ingest validates or refuses, so a red here
      # is a real provider problem and the right thing to see.
      - name: Ingest US daily bars (validate-or-refuse)
        run: npx tsx scripts/ingest/yahoo.ts --only-us

      # The overnight close-to-open premium, both legs. This is the evidence
      # for the only method the register marks LIVE.
      - name: Overnight premium
        run: npx tsx scripts/research/overnightPremium.ts || echo "::warning::overnight premium study failed"

      # The declared-family signal lab. Writes the verdicts and observation
      # counts the home page and /validation quote as the backtest rung.
      - name: Signal lab
        run: npx tsx scripts/research/runLab.ts || echo "::warning::signal lab failed"

      # The level-touch calibration grid behind the reach screen.
      - name: Touch calibration grid
        run: npx tsx scripts/research/touchCalibrationGrid.ts || echo "::warning::touch calibration grid failed"

      # Two artefacts from one replay: the execution statistics forwardScoring
      # reads nightly, and the fingerprint analog library. Slowest step here
      # by a wide margin, which is the reason this workflow is separate.
      - name: Equity replay
        run: npx tsx scripts/backtest/equityReplay.ts || echo "::warning::equity replay failed"

      # Commit BEFORE the gate, deliberately. If three studies re-ran and one
      # did not, those three refreshes are real and should land; the gate then
      # turns the run red for the one that did not. Gating first would throw
      # away good work to report a partial failure.
      #
      # Same no-rebase discipline as the nightly job, for the same measured
      # reason: regenerated JSON conflicts with regenerated JSON every time,
      # and more than one agent works in this repository. Move onto the real
      # tip first with `--mixed`, which repoints the branch without touching
      # the working tree, then stage the declared paths as a diff against it.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # EXACTLY what the studies above write. Enforced in both directions
          # by studyRefresh.test.ts against src/lib/history/studyArtifacts.ts:
          # a file written but unlisted is generated on the runner and
          # destroyed with it while production serves the old copy, and a file
          # listed but unwritten makes this list look more complete than it is.
          DATA_PATHS="src/data/overnightPremium.json src/data/signalValidation.json src/data/touchCalibration.json src/data/equityExecutionStats.json src/data/fingerprintLibrary.json"

          stage_onto_tip() {
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --mixed origin/main
            git add $DATA_PATHS
          }

          stage_onto_tip
          if git diff --cached --quiet; then
            # NOT an early exit. A study re-run on unchanged bars writes
            # byte-identical output, which is a correct outcome — but so does
            # a study that never ran. The gate below is what tells them apart,
            # so this step must not decide the run.
            echo "No byte changes — the gate decides whether that is because the studies re-ran on unchanged bars."
          else
            git commit -m "data: weekly study refresh $(date -u +%F)"
            pushed=""
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "pushed on attempt $attempt"
                pushed=yes
                break
              fi
              echo "push rejected on attempt $attempt — restaging onto the new tip"
              stage_onto_tip
              if git diff --cached --quiet; then
                echo "the newer tip already carries identical data — nothing left to push."
                pushed=yes
                break
              fi
              git commit -m "data: weekly study refresh $(date -u +%F)"
            done
            if [ -z "$pushed" ]; then
              echo "::error::push failed three times against a moving main"
              exit 1
            fi
          fi

      # THE CHECK THAT DECIDES THE RUN. Always runs, including after a failed
      # push, because "did the studies re-run" is a separate question from
      # "did the commit land" and both belong in the log.
      - name: Every study re-stamped inside this run
        if: always()
        run: npx tsx scripts/ci/assertStampsMoved.ts --since "$REFRESH_STARTED_MS"
